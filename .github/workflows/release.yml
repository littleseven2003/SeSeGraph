name: Release

# 正式标签发布：只接受指向 main 的正式 SemVer 标签，任何写操作前先过入口校验。
# 顺序：四平台二进制 → 版本镜像（校验清单、健康接口、匿名拉取）→ 推进 latest → Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的正式标签（形如 v1.1.0）
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sesegraph

jobs:
  guard:
    name: 发布入口校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - id: check
        name: 校验正式标签、main 归属与变更记录
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -eu
          VERSION="$(printf '%s' "$REQUESTED" | tr -d '[:space:]')"
          # 只放行 vX.Y.Z，预发布与构建元数据不进入发布流程。
          if ! printf '%s' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "拒绝：${VERSION} 不是正式 SemVer 标签" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            git fetch --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          fi
          if [ "$(git cat-file -t "refs/tags/${VERSION}")" != "tag" ]; then
            echo "拒绝：${VERSION} 不是附注标签" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "拒绝：检出提交与标签指向不一致" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "拒绝：${VERSION} 没有指向 main 上的提交" >&2
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "拒绝：CHANGELOG.md 缺少 ${VERSION} 小节" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  binaries:
    name: 四平台二进制
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: 交叉编译四个平台
        run: make cross VERSION="${{ needs.guard.outputs.version }}" COMMIT="${{ needs.guard.outputs.commit }}"

      - name: 生成发布资产与校验和
        run: |
          set -eu
          VERSION="${{ needs.guard.outputs.version }}"
          mkdir -p dist-release
          cp bin/sesegraph-linux-amd64 "dist-release/sesegraph-${VERSION}-linux-amd64"
          cp bin/sesegraph-linux-arm64 "dist-release/sesegraph-${VERSION}-linux-arm64"
          cp bin/sesegraph-darwin-arm64 "dist-release/sesegraph-${VERSION}-darwin-arm64"
          cp bin/sesegraph-windows-amd64.exe "dist-release/sesegraph-${VERSION}-windows-amd64.exe"
          cd dist-release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: 校验原生二进制健康接口
        run: |
          set -eu
          VERSION="${{ needs.guard.outputs.version }}"
          COMMIT="${{ needs.guard.outputs.commit }}"
          chmod +x "dist-release/sesegraph-${VERSION}-linux-amd64"
          DATA_DIR="$(mktemp -d)" LISTEN_ADDR=127.0.0.1:18081 \
            "./dist-release/sesegraph-${VERSION}-linux-amd64" &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/health > /tmp/native-health.json; then break; fi
            sleep 1
          done
          cat /tmp/native-health.json
          grep -q "\"version\":\"${VERSION}\"" /tmp/native-health.json
          grep -q "\"commit\":\"${COMMIT}\"" /tmp/native-health.json
          kill "$PID"

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist-release/*
          retention-days: 7

  image:
    name: 双架构镜像发布
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: guard
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.version }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送版本镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.commit }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.guard.outputs.version }}
          labels: |
            org.opencontainers.image.title=SeSeGraph
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 校验版本镜像双架构清单
        run: |
          set -eu
          REF="${IMAGE}:${{ needs.guard.outputs.version }}"
          for arch in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$REF" | grep -q "$arch" || {
              echo "版本镜像清单缺少 $arch" >&2
              exit 1
            }
          done

      - name: 运行版本镜像校验健康接口
        run: |
          set -eu
          REF="${IMAGE}:${{ needs.guard.outputs.version }}"
          docker pull "$REF"
          docker run -d --name sesegraph-release -p 18082:8080 -e DATA_DIR=/app/data "$REF"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/api/health > /tmp/image-health.json; then break; fi
            sleep 1
          done
          cat /tmp/image-health.json
          grep -q '"version":"${{ needs.guard.outputs.version }}"' /tmp/image-health.json
          grep -q '"commit":"${{ needs.guard.outputs.commit }}"' /tmp/image-health.json
          docker rm -f sesegraph-release

      - name: 校验匿名拉取
        run: |
          set -eu
          REF="${IMAGE}:${{ needs.guard.outputs.version }}"
          docker logout ghcr.io
          docker rmi "$REF" || true
          if ! docker pull "$REF"; then
            echo "匿名拉取失败：请由包管理员在仓库 Packages 页把 sesegraph 设为 public 后重跑" >&2
            exit 1
          fi

      - name: 重新登录发布账号
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推进 latest 并复核清单
        run: |
          set -eu
          VERSION="${{ needs.guard.outputs.version }}"
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          for arch in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "${IMAGE}:latest" | grep -q "$arch" || {
              echo "latest 清单缺少 $arch" >&2
              exit 1
            }
          done

  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [guard, binaries, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.version }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist-release

      - name: 生成发布说明
        run: |
          set -eu
          VERSION="${{ needs.guard.outputs.version }}"
          awk -v ver="## [${VERSION}]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, ver) == 1) found = 1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## ${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "发布 ${VERSION}。" >> release-notes.md
          fi
          {
            echo ""
            echo "### 部署"
            echo ""
            echo '- Compose：`SESEGRAPH_IMAGE='"${IMAGE}:${VERSION}"' docker compose up -d`'
            echo '- 单容器：`docker run -d -p 8080:8080 -v ./data:/app/data '"${IMAGE}:${VERSION}"'`'
            echo '- 校验和见 `SHA256SUMS`；数据目录 `/app/data` 需保留，升级前先备份。'
          } >> release-notes.md
          cat release-notes.md

      - name: 发布 Release 与资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${{ needs.guard.outputs.version }}"
          for asset in dist-release/*; do
            [ -s "$asset" ] || { echo "资产为空：$asset" >&2; exit 1; }
          done
          gh release create "$VERSION" \
            --title "SeSeGraph ${VERSION}" \
            --notes-file release-notes.md \
            dist-release/*
