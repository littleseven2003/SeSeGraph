name: Release

# 正式标签发布：从同一提交产出四平台二进制、校验和与双架构容器镜像。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sesegraph

jobs:
  binaries:
    name: 四平台二进制
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: 读取版本与提交
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: 交叉编译四个平台
        run: make cross VERSION="${{ steps.meta.outputs.version }}" COMMIT="${{ steps.meta.outputs.commit }}"

      - name: 生成发布资产与校验和
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist-release
          cp bin/sesegraph-linux-amd64 "dist-release/sesegraph-${VERSION}-linux-amd64"
          cp bin/sesegraph-linux-arm64 "dist-release/sesegraph-${VERSION}-linux-arm64"
          cp bin/sesegraph-darwin-arm64 "dist-release/sesegraph-${VERSION}-darwin-arm64"
          cp bin/sesegraph-windows-amd64.exe "dist-release/sesegraph-${VERSION}-windows-amd64.exe"
          cd dist-release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: 校验原生二进制健康接口
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          chmod +x "dist-release/sesegraph-${VERSION}-linux-amd64"
          DATA_DIR="$(mktemp -d)" LISTEN_ADDR=127.0.0.1:18081 \
            "./dist-release/sesegraph-${VERSION}-linux-amd64" &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/health > /tmp/native-health.json; then break; fi
            sleep 1
          done
          cat /tmp/native-health.json
          grep -q "\"version\":\"${VERSION}\"" /tmp/native-health.json
          grep -q "\"commit\":\"${COMMIT}\"" /tmp/native-health.json
          kill "$PID"

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist-release/*
          retention-days: 7

  image:
    name: 双架构镜像发布
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.binaries.outputs.version }}
            COMMIT=${{ needs.binaries.outputs.commit }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.binaries.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=SeSeGraph
            org.opencontainers.image.version=${{ needs.binaries.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 校验镜像健康接口
        run: |
          set -eu
          IMAGE_REF="${IMAGE}:${{ needs.binaries.outputs.version }}"
          docker pull "$IMAGE_REF"
          docker run -d --name sesegraph-release -p 18082:8080 -e DATA_DIR=/app/data "$IMAGE_REF"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/api/health > /tmp/image-health.json; then break; fi
            sleep 1
          done
          cat /tmp/image-health.json
          grep -q '"version":"${{ needs.binaries.outputs.version }}"' /tmp/image-health.json
          grep -q '"commit":"${{ needs.binaries.outputs.commit }}"' /tmp/image-health.json
          docker rm -f sesegraph-release

      - name: 校验匿名拉取
        run: |
          set -eu
          IMAGE_REF="${IMAGE}:${{ needs.binaries.outputs.version }}"
          docker logout ghcr.io
          docker rmi "$IMAGE_REF" || true
          docker pull "$IMAGE_REF"

      - name: 校验镜像清单架构
        run: |
          set -eu
          docker buildx imagetools inspect "${IMAGE}:${{ needs.binaries.outputs.version }}" | grep -q linux/arm64
          docker buildx imagetools inspect "${IMAGE}:${{ needs.binaries.outputs.version }}" | grep -q linux/amd64

  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist-release

      - name: 生成发布说明
        run: |
          set -eu
          VERSION="${{ needs.binaries.outputs.version }}"
          awk -v ver="## [${VERSION}]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, ver) == 1) found = 1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## ${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "发布 ${VERSION}。" >> release-notes.md
          fi
          {
            echo ""
            echo "### 部署"
            echo ""
            echo '- Compose：`SESEGRAPH_IMAGE='"${IMAGE}:${VERSION}"' docker compose up -d`'
            echo '- 单容器：`docker run -d -p 8080:8080 -v ./data:/app/data '"${IMAGE}:${VERSION}"'`'
            echo '- 校验和见 `SHA256SUMS`；数据目录 `/app/data` 需保留，升级前先备份。'
          } >> release-notes.md
          cat release-notes.md

      - name: 发布 Release 与资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${{ needs.binaries.outputs.version }}"
          gh release create "$VERSION" \
            --title "SeSeGraph ${VERSION}" \
            --notes-file release-notes.md \
            dist-release/*
