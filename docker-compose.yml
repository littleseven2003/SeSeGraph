# SeSeGraph 一键部署：应用容器 + Caddy 自动 HTTPS
# 准备：mkdir -p /opt/sesegraph && cd /opt/sesegraph；放入本文件与 .env、deploy/Caddyfile。
# 默认拉取已发布镜像，版本固定为当前发布版 v1.6.1；跟随后续更新时把 SESEGRAPH_VERSION 改为 latest。
# 也可用 SESEGRAPH_IMAGE 指定完整镜像地址。
# 应用只在内部网络暴露 8080，由 Caddy 终结 TLS 并反向代理。
services:
  # 首次部署时宿主目录由 Docker 建成 root 所有，应用容器以 uid 1000 运行会写不进去。
  # 用一个一次性容器把数据目录建好并交给 uid 1000，再启动应用。
  init:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "mkdir -p /app/data && chown -R 1000:1000 /app/data"]
    volumes:
      - ./data:/app/data

  sesegraph:
    image: ${SESEGRAPH_IMAGE:-ghcr.io/littleseven2003/sesegraph:${SESEGRAPH_VERSION:-v1.6.1}}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATA_DIR: /app/data
      PUBLIC_URL: "https://${DOMAIN:?请在 .env 中设置 DOMAIN}"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAPH_ACCESS_TOKEN: ${TELEGRAPH_ACCESS_TOKEN:-}
      TELEGRAPH_AUTHOR_NAME: ${TELEGRAPH_AUTHOR_NAME:-}
      TELEGRAPH_API_BASE: ${TELEGRAPH_API_BASE:-}
      # 代理、画质与备份项留空即交由设置页管理；填写后该字段以环境变量为准并在界面置灰。
      PROXY_MODE: ${PROXY_MODE:-}
      PROXY_URL: ${PROXY_URL:-}
      PROXY_FOR_TELEGRAM: ${PROXY_FOR_TELEGRAM:-}
      PROXY_FOR_TELEGRAPH: ${PROXY_FOR_TELEGRAPH:-}
      # 系统代理模式读取以下变量；未设置时保持直连
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      UPLOAD_INTERVAL_MS: ${UPLOAD_INTERVAL_MS:-1500}
      # 以下三项留空时采用程序默认值，并允许在设置页或工作台修改。
      UPLOAD_MODE: ${UPLOAD_MODE:-}
      TELEGRAPH_PATH_MODE: ${TELEGRAPH_PATH_MODE:-}
      # 服务端同时接收上传的上限；前端每轮固定两路，此项只影响服务端。
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-3}
      # 图片网关：并发上限，以及满额后的排队深度与单请求最长等待秒数。
      PROXY_CONCURRENCY: ${PROXY_CONCURRENCY:-25}
      PROXY_QUEUE_DEPTH: ${PROXY_QUEUE_DEPTH:-100}
      PROXY_QUEUE_WAIT: ${PROXY_QUEUE_WAIT:-15}
      # 浏览量同步：默认 30 分钟一轮，手动刷新冷却 60 秒
      VIEWS_SYNC_MINUTES: ${VIEWS_SYNC_MINUTES:-30}
      VIEWS_COOLDOWN_SECONDS: ${VIEWS_COOLDOWN_SECONDS:-60}
      # 站点订阅：默认关闭，启用且 PUBLIC_URL 为 HTTPS 时提供 /rss.xml
      RSS_ENABLED: ${RSS_ENABLED:-false}
      # 月度流量看护：留空或 0 表示不启用
      TRAFFIC_ALERT_GB: ${TRAFFIC_ALERT_GB:-}
      TRAFFIC_LIMIT_GB: ${TRAFFIC_LIMIT_GB:-}
      # 自动备份：留空时采用程序默认值（每天 03:00、保留 7 份），并允许在设置页修改。
      BACKUP_ENABLED: ${BACKUP_ENABLED:-}
      BACKUP_CRON: "${BACKUP_CRON:-}"
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      BACKUP_CHANNEL_ID: ${BACKUP_CHANNEL_ID:-}
      BACKUP_INCLUDE_THUMBS: ${BACKUP_INCLUDE_THUMBS:-}
      # 逐图缩略图缓存上限（字节）；留空由设置页维护，默认 2 GiB
      MEDIA_THUMB_LIMIT_BYTES: ${MEDIA_THUMB_LIMIT_BYTES:-}
    volumes:
      # 数据目录由 init 服务建好并授权给 uid 1000。
      - ./data:/app/data
    depends_on:
      init:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sesegraph:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
